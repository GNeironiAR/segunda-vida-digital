<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path — Segunda Vida Digital</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="./js/progress.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #faf7f2;
      color: #2a2620;
      font-family: 'Segoe UI', system-ui, sans-serif;
      line-height: 1.55;
      min-height: 100vh;
    }

    a { color: #7a6a3d; }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* --- Top bar --- */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #e8e2d6;
      gap: 14px;
      flex-wrap: wrap;
    }

    .topbar .brand {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #2a2620;
      font-weight: 500;
      text-decoration: none;
    }

    .topbar nav {
      display: flex;
      gap: 8px;
    }

    .topbar nav a {
      font-size: 13px;
      color: #6a6358;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid #d4ccba;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .topbar nav a:hover {
      background: #ffffff;
      border-color: #7a6a3d;
      color: #2a2620;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 12px;
      background: #ffffff;
      border: 1px solid #e8e2d6;
      border-radius: 20px;
      font-size: 12px;
      color: #6a6358;
    }

    .user-chip .code {
      font-family: 'Courier New', monospace;
      color: #7a6a3d;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .user-chip button {
      background: none;
      border: none;
      color: #6a6358;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
      padding: 2px 4px;
      font-family: inherit;
    }

    .user-chip button:hover { color: #a83a3a; }

    /* --- Header --- */
    .path-header {
      padding: 40px 0 24px;
    }

    .breadcrumb {
      font-size: 13px;
      color: #6a6358;
      margin-bottom: 12px;
    }

    .breadcrumb a {
      color: #7a6a3d;
      text-decoration: none;
    }

    .breadcrumb a:hover { text-decoration: underline; }

    .path-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #2a2620;
      margin-bottom: 12px;
    }

    .path-header .desc {
      font-size: 16px;
      color: #2a2620;
      max-width: 720px;
    }

    .progress-bar {
      margin-top: 22px;
      padding: 14px 18px;
      background: #ffffff;
      border: 1px solid #e8e2d6;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .progress-bar .progress-text {
      font-size: 13px;
      color: #6a6358;
    }

    .progress-bar .progress-text strong {
      color: #2a2620;
    }

    .progress-bar-fill {
      flex: 1;
      min-width: 120px;
      height: 6px;
      background: #e8e2d6;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill > div {
      height: 100%;
      background: #4a6a3a;
      transition: width 0.4s;
    }

    /* --- Modules --- */
    .modules {
      padding: 24px 0 40px;
    }

    .modules h2 {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6a6358;
      margin-bottom: 16px;
    }

    .module {
      background: #ffffff;
      border: 1px solid #e8e2d6;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.2s;
    }

    .module.completed {
      border-left: 4px solid #4a6a3a;
    }

    .module-head {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }

    .module-head:hover { background: #faf7f2; }

    .module-num {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f2ede2;
      color: #6a6358;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .module.completed .module-num {
      background: #4a6a3a;
      color: #ffffff;
    }

    .module-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: #2a2620;
    }

    .module-duration {
      font-size: 12px;
      color: #9a9285;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .module-toggle {
      color: #9a9285;
      font-size: 14px;
      transition: transform 0.2s;
    }

    .module.open .module-toggle { transform: rotate(180deg); }

    .module-body {
      display: none;
      padding: 0 20px 20px 66px;
      border-top: 1px solid #f2ede2;
      padding-top: 16px;
    }

    .module.open .module-body { display: block; }

    .module-desc {
      font-size: 14px;
      color: #2a2620;
      margin-bottom: 14px;
    }

    .resources-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9a9285;
      margin-bottom: 8px;
    }

    .resource {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #faf7f2;
      border: 1px solid #e8e2d6;
      border-radius: 6px;
      margin-bottom: 6px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }

    .resource:hover {
      border-color: #7a6a3d;
      background: #ffffff;
    }

    .resource-type {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid #d4ccba;
      color: #6a6358;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .resource-type.video { color: #a83a3a; border-color: #d4a0a0; }
    .resource-type.practica { color: #4a6a3a; border-color: #b8d4a8; }
    .resource-type.lectura { color: #4a4880; border-color: #b8b4d4; }

    .resource-title {
      flex: 1;
      font-size: 14px;
      color: #2a2620;
    }

    .resource-fuente {
      font-size: 12px;
      color: #9a9285;
    }

    .resource-todo {
      font-size: 12px;
      color: #a83a3a;
      padding: 8px 12px;
      background: #faf7f2;
      border: 1px dashed #d4a0a0;
      border-radius: 6px;
      margin-bottom: 6px;
      font-style: italic;
    }

    /* --- Lesson content (Markdown rendered) --- */
    .lesson-content {
      background: #faf7f2;
      border: 1px solid #e8e2d6;
      border-radius: 8px;
      padding: 22px 26px;
      margin: 4px 0 18px;
      color: #2a2620;
      line-height: 1.7;
    }

    .lesson-content h1,
    .lesson-content h2,
    .lesson-content h3 {
      color: #2a2620;
      letter-spacing: 0.02em;
      margin-top: 22px;
      margin-bottom: 10px;
    }

    .lesson-content h1 { font-size: 1.4rem; font-weight: 600; }
    .lesson-content h2 { font-size: 1.15rem; font-weight: 600; color: #7a6a3d; }
    .lesson-content h3 { font-size: 1rem; font-weight: 600; }
    .lesson-content h1:first-child,
    .lesson-content h2:first-child { margin-top: 0; }

    .lesson-content p { margin: 0 0 12px; font-size: 15px; }

    .lesson-content ul,
    .lesson-content ol {
      margin: 0 0 14px 22px;
      font-size: 15px;
    }

    .lesson-content li { margin-bottom: 6px; }

    .lesson-content strong { color: #2a2620; }

    .lesson-content a { color: #7a6a3d; }

    .lesson-content blockquote {
      margin: 14px 0;
      padding: 12px 16px;
      background: #fef5e6;
      border-left: 4px solid #d4c08a;
      border-radius: 4px;
      color: #6a5520;
      font-size: 14px;
    }

    .lesson-content blockquote p:last-child { margin-bottom: 0; }

    .lesson-content code {
      background: #f2ede2;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.92em;
      color: #7a4a80;
    }

    .lesson-content pre {
      background: #2a2620;
      color: #faf7f2;
      padding: 14px 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 14px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .lesson-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .lesson-content img {
      max-width: 100%;
      border-radius: 6px;
      margin: 10px 0;
    }

    .lesson-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 14px 0;
      font-size: 14px;
    }

    .lesson-content th,
    .lesson-content td {
      padding: 8px 12px;
      border: 1px solid #e8e2d6;
      text-align: left;
    }

    .lesson-content th { background: #f2ede2; }

    .lesson-loading {
      color: #6a6358;
      font-size: 13px;
      font-style: italic;
      padding: 10px 0;
    }

    .lesson-missing {
      color: #6a6358;
      font-size: 13px;
      padding: 14px 16px;
      background: #faf7f2;
      border: 1px dashed #d4ccba;
      border-radius: 8px;
      margin: 4px 0 18px;
      font-style: italic;
    }

    .module-actions {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #d4ccba;
      background: #ffffff;
      color: #2a2620;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:hover { background: #f2ede2; border-color: #7a6a3d; }

    .btn-primary {
      background: #4a6a3a;
      border-color: #4a6a3a;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #3a5a2a;
      border-color: #3a5a2a;
    }

    .btn-pdf {
      background: #ffffff;
      border-color: #7a6a3d;
      color: #7a6a3d;
    }

    .btn-pdf:hover:not(:disabled) {
      background: #7a6a3d;
      color: #ffffff;
    }

    .btn-pdf:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-link {
      background: none;
      border: none;
      color: #6a6358;
      padding: 8px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
    }

    /* --- Certificate section --- */
    .cert-section {
      margin: 32px 0;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e8e2d6;
      border-radius: 12px;
      text-align: center;
    }

    .cert-section.locked {
      opacity: 0.7;
    }

    .cert-section h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2a2620;
      margin-bottom: 8px;
    }

    .cert-section p {
      font-size: 14px;
      color: #6a6358;
      margin-bottom: 16px;
    }

    .cert-section input {
      padding: 10px 14px;
      border: 1px solid #d4ccba;
      border-radius: 6px;
      background: #faf7f2;
      font-size: 14px;
      color: #2a2620;
      min-width: 280px;
      margin-right: 8px;
      font-family: inherit;
    }

    .cert-section input:focus {
      outline: none;
      border-color: #7a6a3d;
      background: #ffffff;
    }

    .cert-section .btn-primary {
      padding: 10px 22px;
      font-size: 14px;
    }

    /* --- Next path --- */
    .next-path {
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e8e2d6;
      border-radius: 12px;
      margin-bottom: 32px;
      border-left: 4px solid #7a6a3d;
    }

    .next-path .label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #9a9285;
      margin-bottom: 8px;
    }

    .next-path .name {
      font-size: 18px;
      font-weight: 600;
      color: #2a2620;
      margin-bottom: 6px;
    }

    .next-path .desc {
      font-size: 14px;
      color: #6a6358;
      margin-bottom: 14px;
    }

    .next-path a {
      display: inline-block;
      padding: 8px 16px;
      background: #ffffff;
      color: #2a2620;
      border: 1px solid #d4ccba;
      border-radius: 6px;
      font-size: 13px;
      text-decoration: none;
    }

    .next-path a:hover {
      background: #f2ede2;
      border-color: #7a6a3d;
    }

    .next-path .branches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .next-path .branch-card {
      display: block;
      padding: 14px 16px;
      background: #faf7f2;
      border: 1px solid #e8e2d6;
      border-left: 4px solid #7a6a3d;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }

    .next-path .branch-card:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42, 38, 32, 0.06);
    }

    .next-path .branch-name {
      font-size: 14px;
      font-weight: 600;
      color: #2a2620;
      margin-bottom: 4px;
    }

    .next-path .branch-desc {
      font-size: 12px;
      color: #6a6358;
    }

    /* --- Footer --- */
    footer {
      padding: 32px 0;
      text-align: center;
      font-size: 12px;
      color: #9a9285;
      border-top: 1px solid #e8e2d6;
    }

    @media (max-width: 600px) {
      .module-body { padding: 16px 16px 16px 16px; }
      .resource { flex-wrap: wrap; }
      .cert-section input { min-width: 0; width: 100%; margin: 0 0 10px 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <a href="./" class="brand">Segunda Vida Digital</a>
    <nav>
      <a href="./">Inicio</a>
      <a href="./cursos.html">Cursos</a>
      <a href="./app.html">Ingresar a gestión</a>
    </nav>
    <div class="user-chip" id="user-chip" style="display:none">
      <span id="user-chip-info"></span>
      <button onclick="SVDProgress.changeCode()">Cambiar</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="path-header" id="path-header"></div>
  <div class="modules" id="modules"></div>
  <div id="cert-section"></div>
  <div id="next-path-section"></div>
</div>

<footer>
  <div class="container">
    Segunda Vida Digital · Proyecto comunitario sin fines de lucro
  </div>
</footer>

<script>
  let pathData = null;
  let allPaths = [];

  SVDProgress.onReady(() => init().catch(err => {
    console.error(err);
    document.body.innerHTML = '<p style="padding:40px;text-align:center;color:#a83a3a">Error: ' + err.message + '</p>';
  }));

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const pathId = params.get('id');
    if (!pathId) {
      document.body.innerHTML = '<p style="padding:40px;text-align:center;color:#a83a3a">Path no especificado. <a href="./cursos.html">Ver todos los cursos</a></p>';
      return;
    }

    const res = await fetch('./data/cursos.json');
    const data = await res.json();
    allPaths = data.paths;
    pathData = allPaths.find(p => p.id === pathId);
    if (!pathData) {
      document.body.innerHTML = '<p style="padding:40px;text-align:center;color:#a83a3a">Path no encontrado. <a href="./cursos.html">Ver todos los cursos</a></p>';
      return;
    }

    document.title = pathData.nombre + ' — Segunda Vida Digital';
    renderUserChip();
    renderHeader();
    renderModules();
    renderCertificate();
    renderNextPath();
  }

  function renderUserChip() {
    const chip = document.getElementById('user-chip');
    if (!SVDProgress.code) return;
    const info = SVDProgress.nombre
      ? `${esc(SVDProgress.nombre)} · <span class="code">${esc(SVDProgress.code)}</span>`
      : `<span class="code">${esc(SVDProgress.code)}</span>`;
    document.getElementById('user-chip-info').innerHTML = info;
    chip.style.display = 'flex';
  }

  function isCompleted(moduleId) {
    return SVDProgress.isModuleCompleted(pathData.id, moduleId);
  }

  async function toggleCompleted(moduleId) {
    await SVDProgress.toggleModule(pathData.id, moduleId);
    renderHeader();
    renderModules();
    renderCertificate();
  }
  window.toggleCompleted = toggleCompleted;

  function pathProgress() {
    const total = (pathData.modulos || []).length;
    const done = (pathData.modulos || []).filter(m => isCompleted(m.id)).length;
    return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  function renderHeader() {
    const { total, done, pct } = pathProgress();
    const color = pathData.color || '#7a6a3d';
    document.getElementById('path-header').innerHTML = `
      <div class="breadcrumb"><a href="./cursos.html">← Volver a todos los caminos</a></div>
      <h1 style="color:${color}">${esc(pathData.nombre)}</h1>
      <p class="desc">${esc(pathData.descripcion || '')}</p>
      <div class="progress-bar">
        <span class="progress-text"><strong>${done} de ${total}</strong> módulos completados (${pct}%)</span>
        <div class="progress-bar-fill"><div style="width:${pct}%"></div></div>
      </div>
    `;
  }

  function renderModules() {
    const mods = pathData.modulos || [];
    const container = document.getElementById('modules');
    container.innerHTML = '<h2>Módulos</h2>' + mods.map((m, i) => renderModule(m, i)).join('');
    container.querySelectorAll('.module-head').forEach(el => {
      el.addEventListener('click', () => {
        const mod = el.closest('.module');
        const wasOpen = mod.classList.contains('open');
        mod.classList.toggle('open');
        if (!wasOpen) loadLessonInto(mod);
      });
    });
  }

  function renderModule(m, i) {
    const done = isCompleted(m.id);
    const adicionales = (m.recursos_adicionales || m.recursos || []);
    const adicionalesHtml = adicionales.length ? `
      <div class="resources-label">Para profundizar</div>
      ${adicionales.map(r => renderResource(r)).join('')}
    ` : '';
    return `
      <div class="module ${done ? 'completed' : ''}" id="mod-${esc(m.id)}" data-module-id="${esc(m.id)}">
        <div class="module-head">
          <div class="module-num">${done ? '✓' : (i + 1)}</div>
          <div class="module-title">${esc(m.titulo)}</div>
          <div class="module-duration">${esc(m.duracion || '')}</div>
          <div class="module-toggle">▾</div>
        </div>
        <div class="module-body">
          <p class="module-desc">${esc(m.descripcion || '')}</p>
          <div class="lesson-container"></div>
          ${adicionalesHtml}
          <div class="module-actions">
            <button class="btn ${done ? '' : 'btn-primary'}" onclick="toggleCompleted('${esc(m.id)}')">
              ${done ? '✓ Completado · marcar como pendiente' : 'Marcar como completado'}
            </button>
            <button class="btn btn-pdf" data-module-id="${esc(m.id)}" disabled title="Disponible cuando carga la lección">
              Descargar PDF
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // Lazy-load the markdown lesson for a module the first time it's opened.
  const _lessonCache = {};
  async function loadLessonInto(moduleEl) {
    const moduleId = moduleEl.getAttribute('data-module-id');
    const container = moduleEl.querySelector('.lesson-container');
    if (container.dataset.loaded === 'true') return;
    container.dataset.loaded = 'true';
    container.innerHTML = '<div class="lesson-loading">Cargando lección...</div>';

    try {
      const md = await fetchLesson(moduleId);
      if (!md) {
        container.innerHTML = '<div class="lesson-missing">📝 Esta lección todavía no tiene contenido propio. Mientras tanto, revisá los recursos para profundizar abajo.</div>';
        return;
      }
      const html = marked.parse(md);
      container.innerHTML = `<div class="lesson-content">${html}</div>`;
      const btn = moduleEl.querySelector('.btn-pdf');
      if (btn) {
        btn.disabled = false;
        btn.removeAttribute('title');
        btn.onclick = () => downloadLessonPDF(moduleEl, moduleId);
      }
    } catch (err) {
      container.innerHTML = '<div class="lesson-missing">Error cargando la lección: ' + esc(err.message) + '</div>';
    }
  }

  async function fetchLesson(moduleId) {
    if (_lessonCache[moduleId] !== undefined) return _lessonCache[moduleId];
    const url = './data/lessons/' + encodeURIComponent(pathData.id) + '/' + encodeURIComponent(moduleId) + '.md';
    const res = await fetch(url);
    if (!res.ok) { _lessonCache[moduleId] = null; return null; }
    const txt = await res.text();
    _lessonCache[moduleId] = txt;
    return txt;
  }

  function downloadLessonPDF(moduleEl, moduleId) {
    const lesson = moduleEl.querySelector('.lesson-content');
    if (!lesson) return;
    const mod = (pathData.modulos || []).find(m => m.id === moduleId);
    const titulo = mod ? mod.titulo : moduleId;

    // Build a clean printable wrapper with header/footer
    const wrapper = document.createElement('div');
    wrapper.style.padding = '20mm';
    wrapper.style.background = '#ffffff';
    wrapper.style.color = '#2a2620';
    wrapper.style.fontFamily = "'Segoe UI', system-ui, sans-serif";
    wrapper.innerHTML = `
      <div style="border-bottom:2px solid #7a6a3d;padding-bottom:10px;margin-bottom:20px">
        <div style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6a6358">Segunda Vida Digital</div>
        <div style="font-size:13px;color:#6a6358;margin-top:4px">${esc(pathData.nombre)}</div>
        <h1 style="font-size:20px;color:#2a2620;margin-top:6px">${esc(titulo)}</h1>
      </div>
      <div class="lesson-content" style="background:transparent;border:none;padding:0">${lesson.innerHTML}</div>
      <div style="margin-top:30px;padding-top:10px;border-top:1px solid #e8e2d6;font-size:10px;color:#9a9285;text-align:center">
        segundavidadigital · Proyecto comunitario · Material gratuito para uso educativo
      </div>
    `;
    document.body.appendChild(wrapper);

    const safe = (pathData.nombre + ' - ' + titulo).replace(/[^\w\s-áéíóúñÁÉÍÓÚÑ]/g, '').trim();
    html2pdf().set({
      margin: 0,
      filename: safe + '.pdf',
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(wrapper).save().then(() => {
      document.body.removeChild(wrapper);
    }).catch(err => {
      console.error(err);
      document.body.removeChild(wrapper);
      alert('No se pudo generar el PDF: ' + err.message);
    });
  }

  function renderResource(r) {
    if (!r.url || r.url === 'TODO') {
      return `<div class="resource-todo">📌 ${esc(r.nota || 'Recurso pendiente de curar')} — ${esc(r.titulo || '')}</div>`;
    }
    const tipoClass = (r.tipo || '').toLowerCase();
    const tipoLabel = (r.tipo || 'enlace').toUpperCase();
    return `
      <a class="resource" href="${esc(r.url)}" target="_blank" rel="noopener">
        <span class="resource-type ${tipoClass}">${esc(tipoLabel)}</span>
        <span class="resource-title">${esc(r.titulo || '')}</span>
        <span class="resource-fuente">${esc(r.fuente || '')}</span>
      </a>
    `;
  }

  function renderCertificate() {
    const { total, done } = pathProgress();
    const completed = total > 0 && done === total;
    const section = document.getElementById('cert-section');
    if (!completed) {
      section.innerHTML = `
        <div class="cert-section locked">
          <h3>🎓 Certificado de finalización</h3>
          <p>Completá todos los módulos del camino para descargar tu certificado.</p>
          <p style="font-size:13px;color:#9a9285">Te faltan ${total - done} módulo${total - done === 1 ? '' : 's'}.</p>
        </div>
      `;
    } else {
      section.innerHTML = `
        <div class="cert-section">
          <h3>🎓 ¡Felicitaciones!</h3>
          <p>Completaste todos los módulos de <strong>${esc(pathData.nombre)}</strong>. Descargá tu certificado:</p>
          <input type="text" id="cert-name" placeholder="Escribí tu nombre completo" value="${esc(SVDProgress.nombre || '')}" />
          <button class="btn btn-primary" onclick="generateCertificate()">Generar certificado</button>
        </div>
      `;
    }
  }

  function renderNextPath() {
    const section = document.getElementById('next-path-section');

    // Case 1: explicit single next path
    if (pathData.siguiente) {
      const next = allPaths.find(p => p.id === pathData.siguiente);
      if (next) {
        section.innerHTML = `
          <div class="next-path" style="border-left-color:${next.color || '#7a6a3d'}">
            <div class="label">Próximo camino</div>
            <div class="name">${esc(next.nombre)}</div>
            <div class="desc">${esc(next.descripcion || '')}</div>
            <a href="./path.html?id=${encodeURIComponent(next.id)}">Ver módulos →</a>
          </div>
        `;
        return;
      }
    }

    // Case 2: no explicit next, but other paths require this one — show branches
    const branches = allPaths.filter(p => p.requiere === pathData.id);
    if (branches.length > 1) {
      section.innerHTML = `
        <div class="next-path" style="border-left-color:#7a6a3d">
          <div class="label">Elegí tu camino</div>
          <div class="name">¿Qué te interesa más?</div>
          <div class="desc">Con lo que aprendiste hasta acá ya podés elegir una especialidad. Cada camino te abre una puerta distinta.</div>
          <div class="branches">
            ${branches.map(b => `
              <a class="branch-card" href="./path.html?id=${encodeURIComponent(b.id)}" style="border-left-color:${b.color || '#7a6a3d'}">
                <div class="branch-name">${esc(b.nombre)}</div>
                <div class="branch-desc">${esc(b.descripcion || '')}</div>
              </a>
            `).join('')}
          </div>
        </div>
      `;
      return;
    }

    // Case 3: single implicit next
    if (branches.length === 1) {
      const next = branches[0];
      section.innerHTML = `
        <div class="next-path" style="border-left-color:${next.color || '#7a6a3d'}">
          <div class="label">Próximo camino</div>
          <div class="name">${esc(next.nombre)}</div>
          <div class="desc">${esc(next.descripcion || '')}</div>
          <a href="./path.html?id=${encodeURIComponent(next.id)}">Ver módulos →</a>
        </div>
      `;
      return;
    }

    section.innerHTML = '';
  }

  function generateCertificate() {
    const name = (document.getElementById('cert-name').value || '').trim();
    if (!name) { alert('Por favor ingresá tu nombre.'); return; }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const w = doc.internal.pageSize.getWidth();
    const h = doc.internal.pageSize.getHeight();

    // Border
    doc.setDrawColor(122, 106, 61);
    doc.setLineWidth(1.5);
    doc.rect(12, 12, w - 24, h - 24);
    doc.setLineWidth(0.3);
    doc.rect(16, 16, w - 32, h - 32);

    // Header
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(106, 99, 88);
    doc.text('SEGUNDA VIDA DIGITAL', w / 2, 32, { align: 'center' });

    // Title
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(36);
    doc.setTextColor(42, 38, 32);
    doc.text('Certificado de Finalización', w / 2, 60, { align: 'center' });

    // Body
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(14);
    doc.setTextColor(106, 99, 88);
    doc.text('Se otorga el presente certificado a', w / 2, 80, { align: 'center' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(28);
    doc.setTextColor(122, 106, 61);
    doc.text(name, w / 2, 98, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(14);
    doc.setTextColor(106, 99, 88);
    doc.text('por haber completado satisfactoriamente el camino de', w / 2, 116, { align: 'center' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.setTextColor(42, 38, 32);
    doc.text(pathData.nombre, w / 2, 132, { align: 'center' });

    // Date
    const fecha = new Date().toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(12);
    doc.setTextColor(154, 146, 133);
    doc.text(fecha, w / 2, 160, { align: 'center' });

    doc.setFontSize(10);
    doc.text('Proyecto comunitario de alfabetización tecnológica · segundavidadigital', w / 2, h - 26, { align: 'center' });

    const safeName = name.replace(/[^a-zA-Z0-9-]/g, '_');
    doc.save(`certificado_${pathData.id}_${safeName}.pdf`);
  }

  function esc(s) {
    if (s === undefined || s === null) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

</script>

</body>
</html>
